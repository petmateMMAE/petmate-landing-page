    <meta name="theme-color" content="#FBF9F3" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PetMate — El carnet digital de tu mascota" />

                <a

                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Descargar PetMate gratis en Google Play"
                >
                  <svg class="btn-play__icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false">

                  <span class="btn-play__text">
                    <span class="btn-play__small">Descárgala gratis en</span>
                    <span class="btn-play__big">Google Play</span>
                  </span>
                </a>
              </div>

              <!-- NOTA DE CTA -->
              <div class="hero__cta-note">
                <span class="cta-note__dot"></span>
                <span>Gratis para siempre · Sin tarjeta de crédito</span>
              </div>

            </div>

            <!-- COLUMNA DERECHA (Vacía) -->
